# Toolchain pins for this repository.
#
#   mise install     # install the pinned toolchains
#   mise run prime   # the gate
#   mise run prime-go # the Go tier alone
#
# ONE TOOLCHAIN. `src/` is gone and with it the Rust tier, so the `rust` pin
# went with the code it pinned — the comment above this line used to say
# "pantry-02 removes the Rust pin with src/", and this is pantry-03.
#
# `bin/prime-go` asserts this pin against `go.mod`'s own `go` directive before it
# runs anything, because nothing else makes the go command enforce either file.
# The pattern came from a Rust gate that had the same hole: three files naming a
# toolchain and a gate that checked none of them, so a developer on a newer
# compiler read the difference as a defect in the code under test (the cafaye-rb
# lesson, and it cost a debugging session).
#
# The Go pin is TWO files and the gate checks both. 1.26.1 is the toolchain
# identity builds and tests on; the root Dockerfile's ARG GO_VERSION is 1.26,
# the tag the image builds with — the same way RUST_VERSION used to name an
# image rather than a patch. go.mod's `go` directive is the second copy and is
# the one the compiler enforces.
[tools]
go = "1.26.1"

[tasks.prime]
description = "The gate"
run = "./bin/prime"

[tasks.prime-go]
description = "The Go tier of the gate: gofmt, build, vet, test"
run = "./bin/prime-go"

[tasks.build]
description = "Build the binary into ./build"
run = "mkdir -p build && go build -o build/pantry ./cmd/pantry"

[tasks.run]
description = "Serve the registry on 0.0.0.0:8080"
run = "go run ./cmd/pantry"

[tasks.fmt]
description = "Fail if anything under ./cmd or ./internal needs gofmt"
run = "gofmt -l ./cmd ./internal"

[tasks.lint]
description = "go vet, which is what this gate treats as the linter"
run = "go vet ./..."

[tasks.test]
description = "The whole suite. No network; the data-path packages bring their own PostgreSQL."
run = "./bin/prime-go"