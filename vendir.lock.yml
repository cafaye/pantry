# vendir.lock.yml — which commit of `cafaye/core` this repository vendored.
#
# WHAT THIS FILE IS FOR. pantry copies two things out of `core`:
#
#   schemas/cafaye.manifest.schema.json   compiled into the binary, and the only
#                                         thing `/readyz` validates against
#   (and, read at test time) examples/valid/*.yml, core's own worked examples
#
# A copy with no recorded origin is a copy nobody can check. It cannot be said to
# be current, and it cannot be said to be stale either — there is no "to" to be
# stale against. Before this file existed, `tests/schema.rs` asserted the vendored
# copy was byte-identical to `core/schemas/…` **in the working tree**, which meant
# a commit in core's repository decided whether *this* repository's gate passed.
# `core-09` added two valid gate declarations to `core/examples/valid/` and
# pantry's gate went red in a repository nobody had touched. That is MD15.
#
# So the rule is now: **resolve core at the ref below, never at the working
# tree.** Every check that reads core says so in its failure message.
#
# WHY A `vendir.lock.yml` AND NOT A `CORE_REF`. Both spellings are real in this
# fleet and `pantry::pin` reads both, in that order — a lockfile is what `vendir`
# and Renovate maintain, and a `CORE_REF` in a workflow env block is the
# hand-bumped form three repositories still use. This repository vendors a
# directory and hand-runs `cp`, so the lockfile is the honest name for the
# record even though no `vendir` process maintains it yet; `pantry::pin` does not
# care which tool wrote it, only that it carries a commit.
#
# WHEN YOU RE-VENDOR, bump this sha in the same commit as the `cp`:
#
#   cp ../core/schemas/cafaye.manifest.schema.json schemas/
#   git -C ../core rev-parse HEAD          # into apiVersion/… below
#
# A stale pin is LEGAL. It is a copy that has not been bumped yet, and the gate
# stays green on purpose — the distance is reported, by name, with the fix, by
# `this_repository_says_how_far_behind_core_it_is` in `tests/schema.rs`. What
# fails is a copy that does not match the ref it claims: that is a defect in this
# repository, and it is the only thing about core that should be able to turn this
# gate red.
#
# The sha below is core's `5ec0cec`, and `schemas/cafaye.manifest.schema.json` is
# byte-identical to core's copy at that commit — which
# `the_vendored_schema_is_core_s_schema_at_the_ref_this_repository_records`
# asserts on every run, rather than this comment asking to be believed.
#
# RE-VENDORED by pantry-23, from `9d6bb87` to `5ec0cec` — 11 commits, and NOT
# housekeeping. The distance test failed on a 9-commit budget, which is the
# mechanism working, but the distance was the symptom and the defect is that
# the copy was WRONG rather than old. core-24 (ec28365) added two keys to the
# manifest schema, `kind` (`service` | `template`) and `environments`, and this
# file's schema closes with `additionalProperties: false`. So a manifest
# declaring either key was a hard REJECT here, not a silently dropped field, and
# `/readyz` validates every entry against this copy at startup — which means
# such a manifest took the whole registry down rather than one entry.
#
# Measured rather than assumed, because "a stale copy is a maintenance chore"
# would have been the wrong reading and the cheap one. A probe manifest
# declaring `kind: template` and nothing else exotic:
#
#   core's own harness, at core HEAD   exit 0, "conforms to core"
#   pantry's vendored copy             rejects it
#
# The second line is why this was not left as an 11-commit note. What made it
# urgent is who the new vocabulary is FOR: core-24 shipped
# `examples/valid/parlor.template.cafaye.yml` — a worked template manifest named
# for the very repository `parlor` that registry/index.yml holds back. The
# schema had a word for it, and this copy did not.
#
# One consequence outside the schema, named here because it is not fixed by the
# `cp`: `src/registry.rs::check_kind` refuses anything but `api` or `cli` for a
# manifest declaring no contract surface, so a manifest that adopts
# `kind: template` would fail the load on the word `template`. That is recorded
# on `parlor`'s row in registry/index.yml, which is where a reader asking "can
# this be registered" will look.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: schemas
    contents:
      - path: .
        git:
          url: git@github.com:cafaye/core.git
          # core's master at the moment these bytes were taken.
          ref: master
          sha: 5ec0cec89db4fce578423a56bcfcc057dd3e8bab
