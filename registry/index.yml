# pantry — the official cafaye service set.
#
# This file is the registry's index. `services/<name>/cafaye.yml` holds one
# verbatim copy of each registered service's own manifest, and this file holds
# only the two facts a manifest cannot state: `kind` and `basePath`.
#
# (The directory-per-entry layout is not cosmetic: `caf contract lint` only lints
# files named exactly `cafaye.yml`, so this shape means the platform's own CLI
# validates every entry —
# `cd ../caf && go run ./cmd/caf contract lint ../pantry/registry/services`.) Everything else a consumer
# needs comes from the service's own file, so there is exactly one answer per
# question and it is the one the service itself gave.
#
# WHY THE SPLIT. core's manifest schema closes with `additionalProperties:
# false`, so `kind` and `basePath` cannot be added to a manifest — and adding
# them would be inventing vocabulary core does not have. A copy of the
# manifest therefore stays a manifest, and the facts that live only in pantry
# live here. See README.md, "Where each fact comes from".
#
# HOW IT STAYS TRUE. tests/drift.rs reads the real service checkout for every
# name below and fails if any field moved — and, since pantry-03, if a single
# BYTE moved, because these copies are verbatim including their comments. A copy
# without that test is a copy that rots; the test is the mechanism, not the
# discipline.
#
# SCOPE. Official cafaye services only. There is no submission flow, no
# third-party registration, no plugin loader and no webhook — those are Phase 5
# (PLAN.md §4b item 3) and building them here is how a registry turns into an
# unaudited code-execution surface. Adding a service is a commit to this file
# and a reviewed pull request, which is the whole trust model.
schemaVersion: 1

services:
  # --- the two facts a cafaye client cannot read off a manifest ---

  # identity serves HTTP and declares `exposes.api: openapi/v1.yaml`.
  # kind: api — the manifest declares an api document and consumes nothing.
  # basePath: /v1 — the common path prefix of every path in that document.
  # core: ^0.1.0, which does NOT contain ^0.2.0. That is what identity's own
  # file says and it is recorded here unchanged: pre-1.0, a caret pins the
  # minor, so `?contract=^0.2.0` legitimately excludes identity.
  identity:
    kind: api
    basePath: /v1
    # The commit of identity's own repository this copy was taken from.
    # Re-recorded at 8db4eeb by pantry-23. `cafaye.yml` is byte-identical at
    # 793977b and at 8db4eeb — identity-26 split the Mailer's link templates
    # per purpose, which is Go, not the manifest — so nothing was re-copied and
    # the ref moved because the copy IS this file at this commit, which is what
    # the field claims and what tests/recorded_copy.rs checks.
    recordedAt: 8db4eeb98ea7fe9b59860c405d2761a3199db618

  # billing serves HTTP; `consumes: []`, so `kind: api` and not `both`.
  billing:
    kind: api
    basePath: /v1
    # The commit of billing's own repository this copy was taken from.
    recordedAt: 72519931c18773aacd66ff8dd942a209af10761e

  # muse serves HTTP; `consumes: []`, so `kind: api`.
  muse:
    kind: api
    basePath: /v1
    # The commit of muse's own repository this copy was taken from.
    recordedAt: 53b6ebb1947eeb1ff90a4cfaff75897f358dc2e9

  # darkroom serves HTTP; its manifest declares no `consumes`, so `kind: api`.
  # basePath: /v1, from the same derivation as the three above — every path in
  # darkroom/openapi/v1.yaml is under /v1 apart from the two probes, which
  # core's conventions keep out of the /v1 prefix and out of the derivation.
  darkroom:
    kind: api
    basePath: /v1
    # The commit of darkroom's own repository this copy was taken from.
    recordedAt: fdb3455b2737bbbb0b978a75171ab5576f91d202

  # courier serves HTTP; `consumes: []`, so `kind: api` and not `both` — even
  # though it publishes five events. Publishing is not subscribing, and the
  # `kind` table keys off `consumes`, so a service that emits and never listens
  # is an `api`. This was the exclusion the tripwire fired on for the third
  # time: courier-03 renamed `email.queued` and its siblings to
  # `courier.email.queued` and siblings, and the stated reason — that the
  # two-segment names fail core's eventType pattern — stopped being true.
  #
  # basePath: /v1, derived from courier's own openapi.yaml. Two things about
  # that derivation, because the document is not like the others' and the reason
  # it is still a derivation is not obvious:
  #
  #   1. The document lives at the REPOSITORY ROOT (`exposes.api: openapi.yaml`),
  #      not under `openapi/` as every other entry's does. It is read from
  #      wherever the manifest says it is, and the path is served verbatim — a
  #      client that reads `exposes.api` and fetches it has to be right.
  #   2. It WAS partial, and this row recorded that at length because a partial
  #      document is a derivation with a hole in it: it covered
  #      `/v1/webhook_endpoints` only, while `GET`/`PUT
  #      /v1/notification_preferences/:user_id` were in courier's router and not
  #      in the file. courier-05 closed that — the document now covers every route
  #      the router serves except `/healthz` and `/readyz`, and says so in its own
  #      header, and a test in courier reads the document and the router and fails
  #      if they disagree, in both directions. The value did not move (`/v1` is
  #      `/v1`) and the derivation did not stop being one: it is still read from
  #      courier's file, still re-derived on every run by tests/drift.rs, and the
  #      rule behind a partial document is still pinned by
  #      `a_partial_openapi_document_still_yields_a_base_path_from_the_paths_it_
  #      publishes` in tests/manifest.rs, because the next service to publish an
  #      incomplete document will hit it. What changed is that this file no longer
  #      has to reason about the hole.
  #      The residual risk is unchanged and is not courier's document: the day
  #      courier documents a path under a SECOND prefix, tests/drift.rs fails on
  #      this row rather than guessing an average.
  courier:
    kind: api
    basePath: /v1
    # The commit of courier's own repository this copy was taken from.
    # Re-recorded at ae8a660 by pantry-23, with the same finding: courier-26
    # added `account_id` as the key on the introspection door and touched no
    # line of the manifest, so the bytes are the ones already recorded.
    recordedAt: ae8a660fd1071d5ba3a80deca0082b14b5b8688b

  # pantry is in its own registry, which is the point: a service registry that
  # cannot describe the registry is a registry `caf dev` has to special-case.
  # The drift test resolves this one name to this repository's own cafaye.yml
  # rather than to a sibling checkout, because for pantry the registry copy and
  # the real service are the same file in the same tree — and that is checked on
  # every run like every other entry.
  pantry:
    kind: api
    basePath: /v1
    # The commit of pantry's own repository this copy was taken from.
    recordedAt: f009b8e2a968f5b1179bb40ca95270033986b6e3

  # guard serves HTTP and its own manifest records the gap: it declares no
  # `exposes` at all because its OpenAPI document has not been written (see the
  # DECISION NEEDED block at the top of guard/cafaye.yml). So `kind: api` is
  # curated rather than derived — it is the one fact in this file a manifest
  # cannot currently speak for. src/registry.rs enforces the rest: as soon as
  # guard declares `exposes.api`, this entry must say `api` or `both`, and the
  # moment it says `worker` or `cli` for a manifest with no event surface the
  # load fails. `api` and `cli` are the two curated values, and guard's is
  # `api` because guard is a gateway, not a binary — see caf's row below for why
  # the manifest cannot say so and tests/kind.rs for what holds it there.
  # basePath: null — and the reason is NOT "no committed OpenAPI document", which
  # is what this row said until pantry-23 re-read it. guard DOES have a
  # document: `guard/openapi/v1.yaml`, 60,222 bytes, committed. What is true is
  # the narrower fact the value actually rests on, and the two are different:
  #
  #   * the document is not NAMED — guard's manifest declares no `exposes` at
  #     all, which is its own recorded DECISION NEEDED above;
  #   * a base path is derived from a document a manifest POINTS AT, so with no
  #     pointer there is no prefix to publish whether or not a file exists.
  #
  # This is the one place where this file and core's `fleet.yml` describe the
  # same repository and disagree. fleet.yml records the same finding against
  # guard — "guard now HAS an OpenAPI 3.1 document on disk at openapi/v1.yaml
  # and still names no exposes.api, so the gap is narrower than the manifest's
  # own note says" — and core is RIGHT. The file is on disk; this comment was
  # the stale half of the pair. `ls guard/openapi/` settles which of the two is
  # wrong, and the answer is this file.
  #
  # So the fix is one line and it is NOT in this repository: add
  # `exposes.api: openapi/v1.yaml` to guard's manifest, and `basePath` becomes
  # derived rather than asserted, `kind: api` becomes derivable rather than
  # curated, and tests/drift.rs can catch this row drifting for the first time.
  # Until then both values here stay exactly as they are and are right:
  # `check_kind` refuses a non-null basePath on a manifest that names no
  # document, so the row cannot drift silently in the meantime.
  guard:
    kind: api
    basePath: null
    # The commit of guard's own repository this copy was taken from.
    recordedAt: c1b328ea2ddbdd99afd556464a04b416e0818a34

  # caf is the platform CLI, and it is registered because it now declares a
  # valid manifest in core's own contract language — not because something
  # routes to it. A service that has declared itself is in the fleet whether or
  # not anything routes to it, and this file describes the fleet. (caf-03 made
  # the file valid; the exclusion record said "register it" and the tripwire
  # tests/schema.rs:every_exclusion_reason_is_still_true said so out loud.)
  #
  # kind: cli, and it is CURATED — the second curated entry, after guard, for
  # the same structural reason. caf's manifest omits `exposes` entirely and says
  # why in its own words: "caf is a binary, not a service: it exposes no HTTP
  # surface and publishes no events". It declares no `consumes` either, so
  # serves_http, publishes and subscribes are all false and no row of the `kind`
  # table in src/registry.rs reaches it. That is why this value is curated
  # rather than derived, and it is the same reason guard's is: nothing in the
  # manifest distinguishes a binary from a service whose document is unwritten.
  #
  # It was `api` before `cli` existed, which is the kind of answer this file
  # exists to stop recording: a client reading `kind: api` and routing to caf
  # finds a binary with no HTTP surface. `api` was admitted for want of a right
  # answer, not because it was one.
  #
  # > DECISION NEEDED (pantry): core's manifest vocabulary has no way to say
  # > "I am a binary", so `cli` stays curated and a person has to say it.
  # > core/docs/manifest-conventions.md rule 3 says "a repository with no
  # > `exposes` is a library or a spec repo" — and caf is neither. The schema
  # > closes with `additionalProperties: false` and `language` is a toolchain,
  # > so nothing in the manifest can carry the fact. That is the same gap
  # > `docs-01` and `cafaye-rb-01` each record about their own `language`
  # > value, seen from the other side: two repositories asking core for a word
  # > it does not have, and this row is the third asking.
  # > Alternatives: (a) a core amendment — an affordance that distinguishes a
  # > binary (a `binary: true` key, a `language` value, or a `kind` enum) — so
  # > that `cli` is derived like `api` and `worker` are, and this row becomes a
  # > consequence rather than a judgement; (b) leave `cli` curated, which is
  # > what this row does, and accept that the value is a human's statement
  # > checked only by tests/kind.rs.
  # > Recommended: (a), for the same reason MD1 ratified `cli` at all — a
  # > vocabulary that cannot say what a manifest proves will be worked around
  # > indefinitely, and three repositories working around it is the beginning
  # > of that. It is a core packet, not this one, and core is read-only from
  # > here.
  # > Cost of flipping (b -> a): one arm in src/registry.rs (the curated set
  # > drops back to `api` where the new core affordance is present), one row,
  # > and no change to any value on the wire.
  # basePath: null — no `exposes.api` and no OpenAPI document anywhere in the caf
  # checkout, so there is no `/vN` prefix to name. Not `/v1` by analogy with the
  # five entries above: a base path is derived from a document that exists, and
  # inventing one for a repository that publishes no surface is the exact
  # longest-common-prefix guess core's rule exists to prevent. The same is true of
  # courier's row, and there the document is partial rather than absent — which
  # is a different thing, and `a_partial_openapi_document_…` in tests/manifest.rs
  # is what keeps it one. `check_kind` now refuses a non-null basePath on a
  # `cli` for the same reason, so this row cannot drift without failing the
  # load.
  caf:
    kind: cli
    basePath: null
    # The commit of caf's own repository this copy was taken from.
    recordedAt: 20a616853e1840c5f3b6fe3aa3a4c23106462d69

  # cafaye-ts is the fleet's TypeScript client, and it is the entry most likely
  # to be filed wrongly in either direction, so this row is long.
  #
  # It is REGISTERED, and the first reason is the one everybody assumes is
  # wrong: registration is a claim that `caf dev` can bring the thing up and
  # `guard` can route to it, and this package is neither. It is registered
  # because it has declared itself in the platform's own contract language — a
  # `cafaye.yml` at its root, valid against core's frozen schema, `caf
  # contract lint: OK` — and that is the same ground `caf` is registered on. A
  # repository that has declared itself is in the fleet whether or not anything
  # routes to it, and this file describes the fleet.
  #
  # WHY `cli` AND NOT `api`, which is the question this row exists to answer.
  # cafaye-ts ships SIX OpenAPI documents — one per service that has one,
  # vendored into specs/ with their provenance in specs/index.json — so the
  # obvious mistake is to read the six documents as six surfaces and file it
  # `api`. It serves nothing, and its own manifest says so at length: `exposes`
  # is absent because "it does not serve traffic, does not receive it, and
  # does not publish events. It is a package other things install", and
  # reaching for `exposes.api: specs/` "would say this package SERVES an API
  # described by those documents. It serves nothing. The documents are vendored
  # INPUTS, and the provenance record for an input is not a contract surface."
  #
  # So the manifest proves nothing: no `exposes.api`, no `exposes.events`, no
  # `consumes` — serves_http, publishes_events and subscribes are all false,
  # and no row of the `kind` table in src/registry.rs reaches a manifest in
  # that state. `worker` and `both` are refused by `check_kind`. That leaves
  # the two curated values, and the other one is guard's: a service that serves
  # HTTP and has not written its document yet. Saying `api` here would be a
  # falsehood, and a falsehood a client acts on — `kind: api` is a routing
  # instruction. `cli` is the honest value: installed rather than brought up,
  # routed to by nobody, and that is a true description of an npm package.
  #
  # basePath: null, and the derivation is the same one caf's row uses. There is
  # no `exposes.api`, so there is no document to read a prefix from, and
  # `check_kind` refuses a non-null basePath on a `cli`, so this cannot drift.
  # Not "/v1" by analogy with the entries above, and not "/v1" because six
  # documents are vendored in specs/: a base path is derived from a document a
  # service PUBLISHES, and these are documents somebody else published and this
  # package copied at a recorded commit. Reading one of them is the
  # longest-common-prefix guess core's rule exists to prevent, and they are six
  # different documents.
  #
  # > DECISION NEEDED (pantry-06, D1): the vocabulary has no word for "a
  # > library other programs import", and this row is where that costs
  # > something. MD1 added `cli` for a binary — installed AND RUN — and a
  # > package with no `bin` and no entry point is imported rather than run, so
  # > `cli` is the least wrong value the schema permits and it is still an
  # > overstatement. The price is paid a few rows below, in the exclusion
  # > record: `cafaye-rb` is this repository in Ruby — same shape, same absence
  # > — and it is held back as `library`. Two client libraries, two answers, in
  # > one file, and a caller asking what to install for a TypeScript service
  # > gets an answer while the same question in Ruby gets nothing.
  # > Alternatives: (a) read `cli` as "an artifact a person installs, run or
  # > imported", and move `cafaye-rb` out of the exclusion record into
  # > `services/` as a second `cli`. The boundary becomes "is it published as
  # > an installable artifact", and `docs` stays a `library` because a
  # > documentation site is installed by nothing; (b) keep `cli` narrow — a
  # > repository with an executable entry point — and move this entry to
  # > `blockedBy: library` beside `cafaye-rb`. One answer for one shape, at the
  # > cost of a published client being invisible to `?kind=`, and of a registry
  # > that cannot answer the only question a TypeScript developer has; (c) a
  # > core amendment — an affordance distinguishing a library from a binary, so
  # > the value is derived rather than curated. That is the same core gap
  # > caf's row below names, now with a fourth repository asking for the word
  # > rather than three.
  # > Recommended: (a), then (c). (a) is one row and one reworded value, it
  # > makes `kind` mean one thing again, and it is the only option under which
  # > the registry answers the question its clients actually ask.
  # > (b) is the honest reading of today's vocabulary, and this packet was told
  # > not to take it, so the inconsistency above is RECORDED rather than
  # > resolved: no row in the exclusion record was changed. Cost of flipping
  # > this row to (b): move one directory, delete one row, and `?kind=cli`
  # > returns `[caf]` again. Cost of flipping `cafaye-rb` to (a): one directory,
  # > one index row, and that row's `library` tripwire stops applying to it —
  # > which is correct, because a registered entry is checked by four drift
  # > tests instead of one.
  cafaye-ts:
    kind: cli
    basePath: null
    # The commit of cafaye-ts's own repository this copy was taken from.
    # Re-recorded at 287ec76 by pantry-23. cafaye-ts-01b re-vendored all six
    # OpenAPI documents and regenerated the SDK; the manifest did not move, so
    # again nothing was re-copied. This is the one case where the distance was
    # worth chasing for its own sake: 4 commits is the largest in the fleet and
    # the ref now says what the bytes are rather than where they were read.
    recordedAt: 287ec76d2343aeab5191fbc8b51659c1e6693fcb

# Official cafaye repositories that are deliberately NOT registered, each with
# the reason and the command that proves it. This is a curation record, not a
# queue: an entry here means the repository is known, checked, and held back
# for a stated reason.
#
# `blockedBy` is machine-checked and is the whole reason this list is not just
# prose. tests/schema.rs asserts the stated reason still holds, which makes the
# list a tripwire in both directions: an entry that starts validating fails the
# suite with "register it", and a reason that stops being true fails too. The
# four values:
#
#   schema       — the repository's cafaye.yml does not validate against core's
#                  schema. Registering it would put a service in the registry
#                  whose own contract file is invalid.
#   no-manifest  — the repository carries no cafaye.yml on master yet.
#   not-a-service— the manifest validates, but the repository is not a service:
#                  `language: spec`, which core's schema defines as
#                  "specification-only repositories". Nothing routes to a spec
#                  repo and no manifest declares a dependency on one.
#   library      — the manifest validates and declares no contract surface at
#                  all, and the repository is something a client DEPENDS ON
#                  rather than something it brings up: a gem, a documentation
#                  site. `language: spec` is only one way of not being a service,
#                  and this value is the other. See the two rows at the bottom.
#
# `library` exists because the three above had no honest row for two real
# repositories, and the alternative was not a fourth value — it was teaching the
# drift test that libraries are exempt. That is an exemption branch in a check
# that has caught three real problems, and PLAN.md §1 forbids one. A vocabulary
# is cheap; a check that can be made green by not checking is not.
#
# caf and courier WERE here, and how they left is the reason to trust the list.
#
# Both rows had one reason that was a fact and one that was an opinion, and in
# both cases a sibling repository's packet made the fact false:
#
#   caf     — "still the pre-core draft shape", made false by caf-03.
#   courier — "its event types are two-segment, so core's eventType pattern
#              rejects them", made false by courier-03, which renamed them to
#              `courier.email.delivered` and siblings.
#
# Each time the tripwire fired and each time the fix was to REGISTER, not to
# teach the test that the case is exempt: an exemption branch is a check that
# has stopped checking, and this one has now earned its keep three times
# (darkroom, caf, courier). A carve-out here would be a weakened check, and
# PLAN.md §1 forbids one.
#
# The rows they replaced are not kept as tombstones, because the exclusion record
# is a record of what is held back *now*. registry/services/caf/cafaye.yml and
# registry/services/courier/cafaye.yml are the honest record of what happened to
# them.
#
# WHAT A GREEN RUN DOES NOT TELL YOU. The tripwire only reports exclusions that
# have gone STALE. It says nothing about whether the seven rows below still being
# ACCURATE, so a green run is not a reason to believe this list — it is a reason
# to re-read the checkouts. Confirm each stated reason against the checkout
# today, not against the last green run. This is the fifth packet to do that by
# hand (darkroom, caf, courier, pantry-05, and pantry-23), and each time it was
# necessary: every one of those exclusions had a reason another repository's
# packet made false. Three of this file's seven rows had a reason made false in
# the twelve hours before pantry-23 read them, and two of those three stayed
# green the whole time.
#
# WHAT pantry-23 FOUND BY RE-READING, because it is the sharpest evidence this
# header has for itself. It re-read all seven rows against the checkouts and
# every one of the three that had moved was wrong in a way the tripwire cannot
# see, in two different ways:
#
#   * `site`'s row asserted the manifest still declared `name: parlor` and a
#     `parlor` remote, and was byte-identical to parlor's. All three were true
#     of the shared SEED commit 33d32e0 and false of the file, because the
#     repository had been renamed since. `site` is `parlor`; `7a44310` is the
#     commit. A row can be a perfect description of a repository that no longer
#     exists.
#   * `cafaye-py`'s row called it "a directory, not yet a repository: no files,
#     no git checkout", and it is a public repository with a pyproject.toml, a
#     CHANGELOG and 948 tests. Three specific false claims, and the row had been
#     carrying them since pantry-05.
#   * `parlor`'s row was ACCURATE and was still wrong to read, because it made
#     the fleet's own website sound like a customer template. The repository
#     behind it had been renamed and the row did not say so.
#
# None of the three could go stale, because all three of their `blockedBy` values
# remained true. The tripwire fires when a reason stops holding; it cannot fire
# when a reason is right about a thing that has since been renamed. That is a
# limit of the mechanism rather than a defect in it, and the only instrument
# that covers it is re-reading, which is why this header is a list of packets
# that did it and not an aspiration.
#
# Every row below is now a repository with a checkout, and the difference is
# stated because the one that was not is what `DECISIONS.md` D2 was about and
# that decision is now RULED: `cafaye-py` is cloned by CI, so its `no-manifest`
# arm is a real assertion against real bytes and not the vacuous pass the row
# used to have to confess to. The one row still not checked on every CI run is
# `cafaye-rb`, and it says so on its face.
#
# This is also the structural point of the whole file: pantry's tests read the
# LIVE filesystem, so any merge anywhere in the fleet can invalidate this
# registry. That is the feature. The cost is that pantry's CI has to run against
# a real workspace or it has verified pantry against itself — see README.md,
# "The drift test needs a workspace", and .github/workflows/ci.yml.
#
excluded:
  # --- `schema`: the manifest does not parse, or would not validate ---------
  #
  # `parlor` is the app-shell TEMPLATE and `site` is the fleet's own website,
  # which is the same repository renamed — see `site`'s row for the rename commit
  # and for why both rows exist. The pair is here rather than one row because
  # they are two repositories with two remotes, two manifests and two lints, and
  # a row is per repository.
  #
  # WHAT core's schema now has a word for, and what neither repository uses yet,
  # because this packet measured it rather than assumed it. `core-24` (ec28365)
  # added `kind: service | template` to `cafaye.manifest.schema.json` and added
  # `examples/valid/parlor.template.cafaye.yml` — a worked example NAMED for
  # this repository, declaring `kind: template`, no `exposes` and no `consumes`.
  # So the vocabulary gap DECISIONS.md D1 and caf's row name is partly closed by
  # core: "not a running process" is now expressible, and the thing it is
  # expressed for is this repository.
  #
  # Neither `parlor/cafaye.yml` nor `site/cafaye.yml` declares `kind` yet, and
  # this repository cannot make either do so. The consequence is stated rather
  # than left to be discovered: pantry's `src/registry.rs` `check_kind` refuses
  # anything but `api` or `cli` for a manifest that declares no contract surface
  # at all, so if `parlor` declared `kind: template` and were copied into
  # `registry/services/`, the load would fail on the word `template` before any
  # curation judgement was reached. That is the honest reason `parlor` is
  # `blockedBy: schema` rather than registered with a curated kind — not the
  # syntax error, which is a separate and smaller thing. See the DECISION NEEDED
  # on `site`'s row's successor: the honest removal path, in order.
  - name: parlor
    blockedBy: schema
