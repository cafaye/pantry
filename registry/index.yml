  # --- `library`: valid, and not something anyone brings up -----------------
  #
  # These two were invisible to this file until pantry-03's
  # `no_workspace_repository_is_missing_from_the_curation_lists` walked the
  # workspace and asked from the other direction. Both carry a valid manifest
  # and neither was registered or excluded, so the registry claimed to describe
  # the fleet while omitting two members of it. They sat in an `UNDECIDED`
  # constant in that test while the question was open; MD2 answered it and the
  # constant is gone, because a third list where a repository needs no reason is
  # a check that can be made green by not checking.
  #
  # `library` says the one fact `not-a-service` cannot: **not something `caf dev`
  # brings up.** Registration is a claim about starting a process and a prefix
  # to route to; a documentation site and a shared gem are neither. Listing them
  # as services would also have made `kind` mean two different things in one
  # column — a `cli` is a binary a self-hoster installs, a library is a
  # dependency, and neither has a base path.
  #
  # The tripwire on these rows is not weaker than the others, and that is the
  # point: `library` goes stale in exactly one direction, and it is the
  # direction that has fired three times. The moment a library's manifest
  # declares `exposes` — an API to serve, events to publish — or a non-empty
  # `consumes`, it is something the platform starts and routes to, so
  # tests/schema.rs fails with "register it" and names the kind its manifest now
  # derives.

  - name: docs
    blockedBy: library
    reason: >-
      The cafaye documentation site — Astro + Starlight, built to a directory of
      static files. Its own manifest is explicit that `exposes` is absent "NOT
      [a] gap in the way it is for billing or guard … this repository serves no
      HTTP traffic of its own … The same shape a library takes", and
      `consumes` is empty. A static site is depended on, not started: there is
      no process for `caf dev` to bring up and no prefix for `guard` to route
      to, and a reader who wants the documentation opens it. Its own
      `> DECISION NEEDED (docs-01)` about `language: typescript` is a real open
      question and stays open in that repository — this row is not a judgement
      about it, and does not resolve it.
    verify: "cd ../caf && go run ./cmd/caf contract lint ../docs/cafaye.yml"
    lint: "OK ../docs/cafaye.yml"

  - name: cafaye-rb
    blockedBy: library
    reason: >-
      The shared Ruby gem: JWKS-backed token verification and the transactional
      outbox writer, depended on by every cafaye Ruby service. core's schema
      says to "omit `exposes` entirely for libraries", and this repository's
      manifest does exactly that and says why — it is "not a service: it is not
      deployed, serves no traffic and publishes no events". `caf deploy` for a
      gem is a gem release, which is a different thing from starting a process
      and not this registry's business. Its two `DECISION NEEDED` blocks (the
      token claim contract, and core's "per-service implementations, never
      shared code") are open questions in that repository and are not answered
      here. NOTE: this repository is private, so the CI drift job cannot clone
      it and this row's reason is verified by a developer's run of
