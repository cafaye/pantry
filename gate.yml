# gate.yml — how pantry is gated, declared rather than guessed.
#
# WHY THIS FILE IS HERE. The cafaye standard for declaring a gate lives in
# `cafaye/core`: `schemas/gate.schema.json` is the format, `harness/gate_check.py`
# is the checker, and `docs/gate.md` is the reasoning. pantry is adopting it, not
# inventing it. The short version of why: across fifteen repositories "run the
# gate" had five different spellings, and every one of them was found by a human
# getting it wrong. A gate that is discovered by failure is a gate that was never
# declared. pantry was one of the services with no `gate.yml` at all, so a
# developer here could run `bin/prime`, see green, and learn nothing about whether
# the gate could detect anything — replacing the gate with `exit 0` would have
# left this repository green.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command resolves, `bin/prime` exists and is executable, `mise run prime` resolves
# to that same file, the CI workflow really invokes it, and — the part that matters
# — that running it makes every line in `proof` below appear, with the countable
# ones at or above their floors. It does NOT prove the tests touched what they
# claim to. A `gate.proof` is a line of output; "30 tests ran" is not "30 tests hit
# Postgres". That is MD12's collect-then-run machinery, owed in `caf`, and it is
# named in core's `harness/gate_findings.json` rather than implied here.
#
# MEASURED, NOT GUESSED. Every number and every pattern below came from running
# this repository's gate and reading its output on pantry at b15e0a0, on an arm64
# host with the cafaye workspace reachable at `/Users/kaka/Code/any/moon/cafaye`:
#
#   * the developer-facing command is `bin/prime`, and `mise.toml` resolves
#     `[tasks.prime]` to `./bin/prime` — verified by reading the task, not by
#     trusting the job name.
#   * `bin/prime` has THREE tiers and one language. `bin/prime-go` runs the Go
#     service's own checks (gofmt, build, vet, test, and a generated-code check);
#     `tests/rls.sh` runs 84 SQL checks against a scratch PostgreSQL with
#     `migrations/` applied and `tests/seed.sql` loaded; the last tier shells into
#     `../caf` and runs `caf contract lint` over this repository's own `cafaye.yml`
#     and every entry in `registry/services`. There is no Rust tier and no second
#     language; see REPORT-registry-norust-03.md for what went with it.
#   * the step banners are all `==> …`, ANSI-wrapped by `step()`. core strips
#     terminal escapes before matching, so the patterns are written against the
#     line a terminal SHOWS and carry no escape tolerance. See the `no-escapes`
#     case in `bin/gate-self-test`, which fails if any `match:` here ever names a
#     terminal escape again.
#
#   * THE COUNTED LINES, and both of them are printed by the gate rather than
#     parsed out of a test runner's per-package output. Measured, with a real
#     PostgreSQL 18.4 on this host:
#
#       suite: 30 passed, 0 failed
#       packages: 2 with tests
#       rls: 84 of 84 checks passed, 0 tier skipped
#
#     and measured again on a machine with no PostgreSQL at all, which is the
#     measurement that decided what the floors below could be:
#
#       suite: 20 passed, 0 failed
#       rls: 0 of 0 checks passed, 1 tier skipped
#       data path: 12 check(s) DID NOT RUN against a database (counted, and named above)
#
#     Read the second set beside the first. `suite` drops by ten and `rls` drops to
#     zero, so a floor on either one is a floor that FIRE ON A MACHINE THAT
#     VERIFIED NOTHING. That is deliberate, and it is the correction this file was
#     rewritten to make: the declaration it replaces carried a `skips: 0` proof
#     whose `minimum: 0` was mathematically incapable of ever failing.
#
#   * WHY TEN AND NOT TWELVE, since both numbers are above and they disagree. The
#     Go tier counts `gates entered` at twelve and the suite loses ten `--- PASS:`
#     lines, because `dbGate()` is called twice by the tests that need a second,
#     unseeded cluster — one test, two gates. `internal/pantrydb`'s own summary
#     line is the count of GATES and `suite:` is the count of TESTS; they are
#     different quantities and neither is wrong.
#
#   * `go test` marks a package with no test files with `?  … [no test files]`, not
#     `ok`, which is what makes `packages: 2 with tests` mean what it says. Five of
#     the seven packages in this module have no test files; the count is of the two
#     that do.
version: 1
name: pantry

gate:
  # The command a person or a tool runs, as an argv and never a shell string, so
  # the exit code is the gate's own. This fleet's one recorded false green was
  # `… | tail -45; echo "PRIME EXIT=$?"` under zsh, where `$?` is tail's and
  # tail is always zero.
  #
  # `bin/prime` and NOT `mise run prime`, and that is a measured claim rather than
  # a taste. `bin/prime` runs `bin/prime-go`, then `tests/rls.sh`, then (when
  # `../caf` is a checkout) `go run ./cmd/caf contract lint`. Its only hard
  # requirement is a Go toolchain on PATH, and it runs correctly under a bare PATH
  # with mise absent. `mise.toml` pins `go = "1.26.1"`, so under a configured shell
  # the two spellings run the same toolchain; declaring `mise run prime` would be
  # declaring a command that cannot run at all without mise installed. Both are one
  # gate here, and `miseTask` below is what lets the checker cross-check that the
  # two agree.
  command: [bin/prime]
  # The fleet's spelling, cross-checked against `entrypoint`: `mise.toml` says
  # `[tasks.prime] run = "./bin/prime"`, so the task and this file cannot drift onto
  # two different gates without `gate.task-unresolvable`.
  miseTask: prime
  # The file behind the command, and the file the mise task must resolve to.
  entrypoint: bin/prime
  # Deliberately generous, for the same reason every other adopter's is. A warm
  # run is ~20s on this host; the first one on a cold checkout also fetches the
  # module graph named in `go.sum`, and the RLS tier's 84 checks stand a scratch
  # cluster up and tear it down. A budget tight enough to be a bug detector is
  # tight enough to be a flake generator on somebody's first run, and a timeout
  # that fires on a cold clone reports a red that is not the suite's answer. This
  # number exists to stop a hung gate, not to measure one.
  timeoutSeconds: 3600
  proof:
    # ---------------------------------------------------------------------
    # THE TOOLCHAIN PROOF, and the first one, because `bin/prime-go` asserts the
    # pin before it does anything else.
    #
    # The banner carries no `minimum` — it reports no countable number, and the
    # schema allows a proof without one for exactly that case. What it asserts is
    # that the version check RAN and passed, which is the thing a bare
    # `go build ./...` script cannot say. If somebody deletes the check, this line
    # is absent and it is `gate.proof-missing`, a failure.
    #
    # The pattern is deliberately loose about the patch: `1.26.1` and `1.26.2` both
    # satisfy the pin (the second would be a security release of the same
    # toolchain), so matching `1\.26\.[0-9]+` rather than the exact string is
    # correct. What it must NOT match is a different minor, and that half is
    # enforced in `bin/prime-go` itself, which exits 127 rather than printing a
    # banner at all.
    - id: toolchain
      match: '^==> toolchain: go 1\.26\.[0-9]+ \(mise\.toml pins 1\.26\.1\)$'
    # ---------------------------------------------------------------------
    # THE GO SUITE, counted by the gate rather than parsed out of `go test`.
    #
    # `suite:` is computed in `bin/prime-go` from the same log it just read, by
    # counting `--- PASS:` lines. That is not decoration and not a convenience: the
    # declaration this file replaces read its count out of cargo's per-binary
    # `test result:` lines, took the LAST match, and therefore read **0 on every
    # run in this repository** — cargo always runs `Doc-tests pantry` last, and
    # that block is empty. The leading `[0-9]+` below would have been a floor that
    # could never be satisfied; a gate that can never go green is not a strict
    # gate, it is a broken one.
    #
    # Both halves are pinned and that is load-bearing: `0 failed` is LITERAL, not
    # `[0-9]+`, so a run that failed cannot satisfy this proof by printing a big
    # number next to a red. A skipped test is neither — `go test` prints `--- SKIP:`
    # and does not count it here — which is why this floor ALSO fires on a machine
    # with no PostgreSQL (30 measured, 20 measured there). That is the property,
    # not a bug in it; see the `data-path` proof for what reads the skip case in
    # words.
    #
    # The count is of PASS lines and not of tests that did not fail: a red run
    # still prints every passing test in the failing packages. Read this WITH
    # `bin/prime`'s exit status and the `--- FAIL:` lines, which are what say the
    # gate is red.
    - id: suite
      match: '^suite: ([0-9]+) passed, 0 failed$'
      # 30 against a measured 30, and the margin is ZERO on purpose.
      #
      # The floor this replaces was 144 against a measured 146, and its own
      # comment recorded the rule that governs the number: the margin must be
      # SMALLER THAN THE SMALLEST TEST FILE, or a file small enough to fit inside
      # the margin can be deleted and the run stays green. That is guard's
      # near-miss reproduced in pantry, and it was caught by measuring file sizes
      # rather than by reasoning about them.
      #
      # Here the smallest deletable unit is a single test, so the margin that
      # catches every deletion is zero. The cost is that a deliberate test
      # REMOVAL is a red until this number is lowered in the same commit — which
      # is the correct cost. A decrease-detector whose floor can be satisfied by a
      # loss has stopped detecting, and adding tests is exactly what opens that
      # margin, which is why a floor that was right on the day it was written goes
      # wrong without anybody editing it.
      #
      # RAISING OR LOWERING THIS NUMBER BELONGS IN THE SAME COMMIT AS THE TEST
      # CHANGE IT ACCOUNTS FOR, in both directions.
      minimum: 30
    # ---------------------------------------------------------------------
    # THE RLS TIER, which the declaration this file replaces said NOTHING about.
    #
    # That is the largest gap the rewrite closes, and it is worth naming plainly:
    # `tests/rls.sh` ran 84 checks on every `./bin/prime` and not one of them was
    # in `proof`. A tier can be deleted outright — `rm tests/rls.sh` — and this
    # declaration would have stayed green, because everything it asserted lived in
    # a language that is no longer here.
    #
    # `rls:` is printed by `bin/prime` from the suite's own `checks:` line. The
    # second and third numbers are matched loosely on purpose: the floor is the
    # first one, and pinning `0 tier skipped` into the PATTERN would turn a machine
    # with no PostgreSQL into `gate.proof-missing` (a red that names a missing
    # string) instead of `gate.floor` (a red that names the number). The floor is
    # the better-shaped failure and it reads 0 on that machine.
    - id: rls
      match: '^rls: ([0-9]+) of [0-9]+ checks passed, [0-9]+ tier skipped$'
      # 84 against a measured 84: 84 run, 84 passed, 0 failed, 0 skipped, on
      # PostgreSQL 18.4. Margin zero, for the same reason `suite` has one.
      #
      # `tests/rls.sh` counts a skipped CHECK as neither a pass nor a fail, so
      # this number drops when a check stands down rather than when one fails —
      # which is the direction a floor wants to catch.
      minimum: 84
    # ---------------------------------------------------------------------
    # THE DATA PATH, in words, and the proof that replaces a floor of zero.
    #
    # **The declaration this file replaces carried `skips: 0` with
    # `minimum: 0`, and that proof could not fail.** A `minimum` is a LOWER bound,
    # the value it read was 0, and no run of this gate has ever produced a
    # negative number of skips. Its comment said so at length and then shipped the
    # floor anyway, which is the shape of a check that documents its own uselessness
    # and stays in the file.
    #
    # This proof is the same claim with the failure direction reversed: it matches
    # the line `bin/prime-go` prints when every database-backed gate ENTERED, and
    # NOT the line it prints when some did not. A skip is therefore
    # `gate.proof-missing` — a failure — rather than a number a human has to
    # notice. Measured on this host with PostgreSQL 18.4 the line reads:
    #
    #   data path: every check ran against a real PostgreSQL (0 skipped)
    #
    # and with `PANTRY_PG_BIN` pointed at a directory holding no server binaries:
    #
    #   data path: 12 check(s) DID NOT RUN against a database (counted, and named above)
    #
    # THE CONSEQUENCE, stated here because it changes who can run this gate: **a
    # machine with no PostgreSQL is red.** That is a change from the behaviour the
    # previous declaration described, and it is the intended one. `bin/prime` still
    # exits 0 there, because the SCRIPT's contract is "counted skips are legitimate,
    # and `PANTRY_DB_REQUIRED=1` is how a caller insists" — a developer without a
    # database can still run the gate and read what stood down. This declaration is
    # stricter on purpose: CI is the thing that must not be green over a database
    # that was never stood up, and the workflow's `build` job now sets
    # `PANTRY_DB_REQUIRED=1` and `PANTRY_RLS_REQUIRED=1` and carries a postgres
    # service so that the strictness costs CI nothing.
    #
    # `minimum` is deliberately absent. The line carries no count on the success
    # branch, and the schema reads a floor out of exactly one capture group; adding
    # one would make this `gate.proof-invalid`. The claim is PRESENCE, and presence
    # is the whole of it.
    - id: data-path
      match: '^data path: every check ran against a real PostgreSQL \(0 skipped\)$'
    # ---------------------------------------------------------------------
    # The step markers. Three of them, no `minimum`, so all they assert is that
    # the banner was printed. They are here because `bin/prime` can exit 0 having
    # done less than it appears to, and each of these is a way that happens.
    #
    # **TWO BANNERS ARE ABSENT AND THE CAP OF EIGHT IS THE REASON**, which is a
    # real constraint rather than a preference — the checker refused a ninth
    # declaration with `gate.schema: gate/proof: minItems 1, maxItems 8`, and the
    # schema working on the declaration that declares the checks is the whole point
    # of having a checker.
    #
    # `gofmt` went rather than any of the three above. `gofmt -l` is a formatting
    # check, so a repository that stopped being formatted is a repository whose
    # diff is ugly; `go vet ./...` failing is `gate.nonzero` either way. A missing
    # `vet` step is a gate that quietly stopped linting; a missing `gofmt` step is
    # a gate that stopped tidying. This is the same trade the previous version of
    # this file made when it cut `fmt` to keep `clippy`, and it is recorded here
    # rather than left to look like an oversight.
    #
    # `go test ./...` and `packages:` went for a different and better reason: the
    # `suite` floor above counts the output of that very step, so a banner
    # asserting the step ran would be a proof of a proof. The count is the
    # stronger form and it is already here.
    - id: vet
      # THE ONE WORTH ITS PLACE. `go vet ./...` is the step that turns a lint into
      # a red, and a gate that quietly stopped linting would still be green — the
      # script's own header says every step is load-bearing, and this is the only
      # thing that would notice one going missing. Deleting the step removes the
      # banner with it. `go vet` is this repository's `cargo clippy -D warnings`:
      # it ships with the toolchain, needs no separate binary, and fails the build
      # on a finding.
      match: '^==> go vet \./\.\.\.$'
    - id: lint
      # The manifest step, and the one with a two-sided shape. It runs
      # `caf contract lint` over this repository's own `cafaye.yml` and over every
      # registry entry when `../caf` is a checkout, and prints `OK <path>` per file
      # when it runs. On a pantry-only clone it prints `skipped: ../caf is not a
      # checkout here.` instead and the gate stays green.
      #
      # So this proof matches the BANNER, which both paths print, and not the `OK`
      # lines, which only one does. That is a real limitation and it is the honest
      # reading: this proof says the step exists, not that it linted anything.
      # What protects the linted content is that the step is a subprocess whose exit
      # code is the gate's own.
      match: "^==> the manifest validates against core's schema$"
    - id: ok
      # The gate reached its own last line. With `vet` and `lint` bracketing it,
      # the three markers say: the gate linted, it found nothing fatal, and it
      # finished. Cheap, and it is what distinguishes "the suite printed its
      # summary" from "the gate completed".
      match: '^==> ok$'

external:
  # NOT self-contained, and saying so is the point. `bin/prime` needs a Go
  # toolchain this repository pins rather than ships, a module fetch on a cold
  # checkout, a PostgreSQL server to run 84 SQL checks and 12 database-backed Go
  # gates against, and — for the manifest step — a checkout of `caf`. A
  # declaration that called this self-contained would be describing a gate nobody
  # has ever run on a clean machine, which is the same defect as identity's gate
  # being green over a database nobody had migrated, told the other way round.
  selfContained: false
  requirements:
    # THE TOOLCHAIN PIN, and this is the entry the cafaye-rb packet's lesson asks
    # for. `mise.toml` pins `go = "1.26.1"`, `go.mod`'s `go` directive says
    # `1.26.1` and is the copy the COMPILER enforces, and the Dockerfile's
    # `ARG GO_VERSION` names the image tag. Three files, one number, and nothing
    # else: whatever `go` answers on PATH is what builds and tests the gate unless
    # something checks, which is why `bin/prime-go`'s FIRST step compares all three
    # and exits 127 naming `mise install` rather than letting a wrong toolchain
    # produce a confusing build error three steps later.
    #
    # That is exactly the failure cafaye-rb hit — a gate that ran on macOS system
    # Ruby while its own `external` requirement named a different version, and
    # red-herring on gem errors instead of saying "the wrong toolchain answered".
    - kind: toolchain
      name: go 1.26 — the pin in mise.toml, the compiler-enforced directive in go.mod, and the Dockerfile's GO_VERSION
      satisfy:
        # A bare name is a claim about THIS MACHINE, so the checker reports
        # `gate.requirement-unproven` and deliberately leaves the exit code alone.
        # That severity is correct: a checker that failed on it would be red on a
        # laptop and green on CI.
        command: [mise, install]
        # Quoted, and that is not decoration: a plain YAML scalar may not contain
        # ": ", so the unquoted spelling of this sentence is a document core's
        # restricted reader accepts and every other YAML parser in the fleet
        # refuses. The schema is the thing that taught me this.
        unmet: 'bin/prime exits 127 at its first step with "go is 1.X, and mise.toml pins 1.26.1" in the message, and no step banner is printed at all'
    # Demonstrated on a cold checkout only. `go.sum` pins the module graph and
    # `go build ./...` is the first thing that reaches for it; a warm gate touches
    # the network not at all, so saying "network" flatly would over-claim a
    # dependency this gate does not always have. This entry REPLACES the crates.io
    # one the Rust tier needed, for the same reason and with the same shape.
    - kind: network
      name: a Go module proxy, ONCE, on a cold checkout only — the modules in go.sum, and nothing after the first fetch
      satisfy:
        # A bare name for the same reason as the toolchain above, and the honest
        # spelling is the command `bin/prime` itself runs, so satisfying this
        # requirement and building the tree are the same act on a cold checkout.
        command: [go, mod, download]
        unmet: go build ./... exits nonzero naming a module in go.sum, with a network or download error
    # THE NEW ONE, and the reason this requirement exists at all: pantry's tests
    # are about ROW-LEVEL SECURITY, and row-level security cannot be checked
    # without a database. There is no mock for it, there is not a fake for it, and
    # 84 of the checks in `tests/rls.sh` plus 12 of the 30 Go tests open a real
    # connection to a real server with `migrations/` applied.
    #
    # Both scripts find one themselves — `tests/rls.sh` starts a scratch cluster
    # with `initdb`, applies the migrations, seeds it and removes it on exit, and
    # the Go tier runs that same script with `--serve` — so nothing here has to be
    # installed beyond the three server binaries. What the requirement declares is
    # that those binaries have to EXIST somewhere, and that their absence is a red
    # in CI rather than a skip.
    - kind: filesystem
      name: PostgreSQL server binaries — pg_ctl, psql and initdb — on PATH or at PANTRY_PG_BIN, plus the ports a scratch cluster binds
      satisfy:
        # Repository-relative, so the checker verifies the thing is here rather
        # than pointing at a page. `tests/rls.sh --print-pg-bin` is the smallest
        # argv in this repository that makes the answer observable, and it is the
        # same answer `bin/prime` acts on.
        command: [tests/rls.sh, --print-pg-bin]
        unmet: >-
          bin/prime prints "rls: 0 of 0 checks passed, 1 tier skipped" and "data
          path: N check(s) DID NOT RUN", names PANTRY_PG_BIN, and exits 0 — a
          correct, honest, COUNTED skip, and a gate.proof-missing against the
          data-path proof above. Set PANTRY_DB_REQUIRED=1 and
          PANTRY_RLS_REQUIRED=1 to turn it into exit 3 at the script's own level
    # The manifest lint, and it is a DIFFERENT host and a DIFFERENT failure from
    # anything above, which is why folding it in would hide it: it needs a Go
    # toolchain (covered) and a `caf` checkout at `../caf`.
    - kind: filesystem
      name: a caf checkout at ../caf, holding go.mod and cmd/caf — bin/prime's last tier runs caf's own contract lint over cafaye.yml and every registry/services entry
      satisfy:
        command: [go, version]
        unmet: >-
          bin/prime prints "skipped: ../caf is not a checkout here", the gate
          exits 0, and no manifest in registry/ was linted by the platform CLI.
          Measured: a clone in a directory with no cafaye sibling takes this branch
  # NOT required, and named so nobody goes looking for them:
  #
  #   * NO CREDENTIAL, of any kind, and this is the sharpest entry in the block
  #     rather than a reassurance. Every cafaye repository is public, so CI clones
  #     the fleet anonymously over HTTPS with no `secrets:` at all. An earlier
  #     version of the drift job cloned over SSH with a deploy key from repository
  #     settings, on the assumption the repositories were private. They are not,
  #     and that key was a long-lived private key created to work around a problem
  #     that did not exist. It is gone and this comment does not name it: naming it
  #     would invite exactly the search that puts it back.
  #   * no PERSISTENT database and no service. The scratch cluster is created,
  #     seeded and destroyed inside one `./bin/prime`; the suite binds a port on
  #     loopback and removes the data directory on exit, including on SIGINT.
  #   * no fixed port, and no container runtime. `initdb` picks a free one.
  #   * no browser, no image, and nothing outside the repository except the sibling
  #     checkout and the PostgreSQL binaries named above. The build cache and the
  #     scratch data directories are written outside the tree.

ci:
  workflow: .github/workflows/ci.yml
  # `./bin/prime`, verbatim — the `build` job's step. Checked TEXTUALLY against the
  # workflow's `run:` bodies, so a workflow that stops calling the gate becomes
  # `gate.ci-disagrees` rather than a quiet divergence.
  #
  # WHAT CHANGED HERE, and it is the second gap this rewrite closes. The `build`
  # job used to re-spell the four cargo steps as four separate `run:` lines —
  # `cargo fmt --check`, `cargo build --all-targets`, `cargo clippy`, `cargo test`
  # — rather than calling `bin/prime`. That was a real difference between the
  # developer-facing command and the CI command, measured rather than assumed, and
  # it is why a step added to `bin/prime` was not run by `build` and nothing in
  # the workflow or the suite noticed.
  #
  # The job now runs `./bin/prime` itself, with `PANTRY_DB_REQUIRED=1` and
  # `PANTRY_RLS_REQUIRED=1` set and a `postgres` service alongside it, which is
  # what makes this declaration's strict `data-path` proof affordable in CI.
  invokes: [./bin/prime]