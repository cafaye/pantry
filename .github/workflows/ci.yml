name: ci

# PLAN.md §1: the gate runs under `set -o pipefail`, and a gate whose exit code
# was not observed is treated as unrun, not as green.
env:
  # THE TWO FLAGS THAT MAKE A MISSING DATABASE A RED INSTEAD OF A SKIP.
  #
  # Both scripts here will happily stand down and exit 0 when they cannot find a
  # PostgreSQL, and that is the right behaviour for a developer on a laptop with
  # no database: the run says which gates did not run, in words, and the rest of
  # the gate still means something. It is the WRONG behaviour for CI, where a
  # green badge over a database that was never stood up is precisely the
  # "green over nothing" failure this repository has been bitten by three times.
  # So CI asks for the hard form and provides the thing it asks for.
  #
  # `PANTRY_RLS_REQUIRED` is read by `tests/rls.sh` (the 99 SQL checks) and
  # `PANTRY_DB_REQUIRED` by `bin/prime-go` (the 12 database-backed Go gates).
  # Both turn "no server binaries" into exit 3.
  PANTRY_RLS_REQUIRED: "1"
  PANTRY_DB_REQUIRED: "1"

jobs:
  gate:
    name: the gate (one command, as a developer runs it)
    runs-on: ubuntu-latest
    # The scratch cluster `tests/rls.sh` stands up needs no service container:
    # the suite runs `initdb` itself, picks a free port, and removes the data
    # directory on exit. What it needs from the runner is the three BINARIES, and
    # the step below says so out loud rather than letting their absence turn into
    # a skip. A `postgres` service container would not help — there is nothing to
    # connect to, because nothing is listening before the suite starts.
    steps:
      - uses: actions/checkout@v4

      # `go-version-file: go.mod` rather than a literal version, and that is the
      # point: the pin now lives in `go.mod` (which the compiler enforces) and in
      # `mise.toml` (which the gate's first step checks against it), and a literal
      # here would be a FOURTH copy for CI to disagree with. Two copies, one of
      # them checked by `bin/prime-go` at startup.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # PROVE THE DATABASE IS AVAILABLE BEFORE RUNNING ANYTHING AGAINST IT.
      #
      # `tests/rls.sh` finds its own PostgreSQL by looking in a list of well-known
      # directories and then falling back to `pg_ctl` on PATH, and when it finds
      # none it prints a counted skip and exits 0. That is the correct behaviour
      # for a laptop and the wrong one for a badge, and the env vars above are
      # what turn it into a red — but a red that arrives at the END of a two-minute
      # run, naming a skip, is a worse report than one that arrives in four
      # seconds naming the directory it looked in.
      #
      # So this step runs the harness's own discovery, in list mode, and fails
      # here if it comes back empty. `--print-pg-bin` is the same code path
      # `--serve` uses to choose, so a green here is a green there.
      #
      # THE TEST IS ON THE VALUE AND NOT ON THE EXIT STATUS, and that is a
      # measured correction rather than a style. `--print-pg-bin` exits **0** when
      # it finds nothing, printing `skip: …` on stderr and the resolved directory
      # — or nothing at all — on stdout, because its contract is "report what I
      # resolved, and a caller that cannot run still gets to say so". A first draft
      # of this step branched on the exit status and would therefore have gone
      # green on a runner with no PostgreSQL, printing an empty PANTRY_PG_BIN and
      # letting the gate skip 96 checks behind a green badge. The empty-string test
      # below is what actually holds the line.
      #
      # AND NOTHING IN THIS STEP MAY NAME THE GATE, which is a correction the
      # self-test forced rather than a style. This step used to end its error
      # message with `bin/prime would then be a green badge over 99 SQL checks`,
      # and core reads a workflow by substring-matching the declared argv against
      # every `run:` body — with a `./` prefix treated as optional. That message
      # was inside a `run:` body, so it satisfied `gate.ci`'s reachability check
      # on its own: `bin/gate-self-test`'s "a CI workflow whose gate step carries
      # a different command" case went green over a workflow with no gate step in
      # it. Deleting the gate step from CI would have been silent. It says "the
      # gate" here, and every error message in this file is written the same way,
      # because the cost of the next word is a checker that cannot see a deleted
      # step.
      - name: prove a PostgreSQL is available to the suite
        run: |
          set -euo pipefail
          pgbin="$(./tests/rls.sh --print-pg-bin)"
          if [ -z "$pgbin" ]; then
            echo "::error::no PostgreSQL server binaries (pg_ctl, psql, initdb) on this" >&2
            echo "::error::runner. tests/rls.sh would print a counted skip and exit 0," >&2
            echo "::error::and the gate would then be a green badge over 99 SQL" >&2
            echo "::error::checks and 12 Go gates that never ran. Install PostgreSQL" >&2
            echo "::error::server binaries, or set PANTRY_PG_BIN." >&2
            exit 1
          fi
          echo "postgres binaries: ${pgbin}"
          echo "PANTRY_PG_BIN=${pgbin}" >> "$GITHUB_ENV"

      # `caf` is cloned as a SIBLING of this checkout, which is where `bin/prime`
      # looks for it (`../caf/go.mod`). That is what makes its last tier run for
      # real instead of printing `skipped: ../caf is not a checkout here`: the
      # platform CLI validates this repository's `cafaye.yml` and every entry under
      # `registry/services` on every run, using the platform's own schema.
      #
      # NO CREDENTIAL. Every cafaye repository is public, so this is an anonymous
      # HTTPS clone with no `secrets:` anywhere in this file.
      - name: check out caf, for the manifest tier
        run: git clone --depth 1 https://github.com/cafaye/caf.git ../caf

      # THE GATE, and only the gate. The previous `build` job re-spelled four
      # cargo steps as four separate `run:` lines — `cargo fmt --check`,
      # `cargo build --all-targets`, `cargo clippy`, `cargo test` — instead of
      # calling `bin/prime`. That was a real difference between the
      # developer-facing command and the CI command, and it is why a step added to
      # `bin/prime` was not run by CI and nothing noticed. This job runs the same
      # file a developer runs. The exit code is the last command's and nothing is
      # piped, per PLAN.md §1.
      - name: prime
        run: ./bin/prime

  # ---------------------------------------------------------------------
  # WHAT THIS WORKFLOW NO LONGER DOES, and it is the honest cost of the packet
  # that removed the Rust suite. Written here rather than left to be inferred
  # from a green badge, which is where the last version of this file's job list
  # went wrong.
  #
  # There WAS a second job, `workspace-drift`, and it existed for one reason: the
  # Rust tests `tests/drift.rs`, `tests/recorded_copy.rs`, `tests/schema.rs` and
  # `tests/ci.rs` verified `registry/` against LIVE sibling checkouts, and on a
  # clone of pantry alone there was nothing to compare against, so the job cloned
  # twelve repositories anonymously and pointed `PANTRY_CAFAYE_ROOT` at them.
  #
  # All four of those files were 146 Rust tests about the REGISTRY MANIFEST
  # FORMAT and the vendored core schema pin. They are deleted with `src/`, because
  # the thing they checked was the Rust service's manifest and the Rust service is
  # gone. **Nothing in this repository now reads a sibling checkout** except
  # `bin/prime`'s manifest tier, which needs `caf` and nothing else — and that is
  # checked out above.
  #
  # So keeping that job would mean cloning twelve repositories to verify nothing:
  # a slow, expensive green that says the fleet was checked when no code in this
  # repository looked at it. That is the exact shape of the defect this packet
  # exists to remove, and it is removed rather than preserved.
  #
  # WHAT IS THEREFORE NO LONGER CHECKED ANYWHERE, stated plainly:
  #
  #   1. That each `registry/services/<name>/cafaye.yml` is a verbatim copy of
  #      that service's own manifest, and that each `recordedAt` commit still
  #      exists. `tests/recorded_copy.rs` was the only check.
  #   2. That `vendir.lock.yml`'s recorded core schema sha is still core's, and
  #      that `schemas/` matches it. `tests/core_pin.rs` and `tests/schema.rs`
  #      were the only checks.
  #   3. That `registry/index.yml` curates nothing this repository cannot read,
  #      and that its exclusion rows' reasons are still true. `tests/ci.rs` and
  #      `tests/drift.rs` were the only checks, in both directions.
  #   4. That `CAFAYE_UNREADABLE` is still exactly the set of repositories an
  #      anonymous clone cannot fetch. Nothing checks it now.
  #
  # NONE OF THAT IS RESTORED BY THIS PACKET, and none of it should be restored in
  # Rust. The honest reading is that registry drift has a real coverage gap, the
  # gap is a consequence of deleting a suite rather than of anything breaking, and
  # closing it means writing the checks in Go against the same inputs. That is
  # owed work with a name, not a task smuggled into a cleanup — see
  # REPORT-registry-norust-03.md and DECISIONS.md D33. A coverage gap that is
  # written down is recoverable; one that is papered over with a job that clones
  # repositories nobody reads is not.