name: ci

on:
  push:
    branches: [master]
  pull_request:

# PLAN.md §1: the gate runs under `set -o pipefail`, and a gate whose exit code
# was not observed is treated as unrun, not as green.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: build
        run: cargo build --all-targets

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # This job alone is a pantry-only clone, so the drift tests in
      # tests/drift.rs and three in tests/schema.rs find no cafaye workspace,
      # print `SKIP …` on stderr and return. That is not a defect in them and
      # it is not hidden: a skip is reported, never swallowed. But the
      # consequence has to stay written down rather than left to be inferred
      # from a green badge, so:
      #
      #   A GREEN RUN OF THIS JOB HAS VERIFIED PANTRY AGAINST ITSELF, NOT
      #   AGAINST REALITY. It has checked that the registry is internally
      #   consistent, that every entry satisfies core's vendored schema, and
      #   that the filter and paging contracts hold. It has NOT checked that
      #   any entry still says what its service says.
      #
      # The job below is what answers that, and it is the one that makes the
      # badge mean something. This job is a fast inner loop; it is not the gate
      # on the registry.
      - name: test
        run: cargo test --no-fail-fast

  # ---------------------------------------------------------------------
  # THE JOB THAT ACTUALLY CHECKS THE REGISTRY. It runs.
  #
  # pantry's tests verify the registry against the LIVE filesystem: for every
  # registered name they open the sibling checkout and compare bytes, fields
  # and OpenAPI documents. On a clone of pantry alone there is nothing to open,
  # so `workspace-drift` exists to build the workspace first and then run the
  # ordinary gate against it. Nothing here is pantry-specific: it fetches the
  # fleet and calls ./bin/prime, which is the same command a developer runs.
  #
  # WHY NO CREDENTIAL. Every cafaye repository is public, so a hosted runner
  # clones all of them over anonymous HTTPS and no secret of any kind is
  # involved. An earlier version of this job cloned over SSH with a deploy key
  # passed in from this repository's settings, on the assumption that the
  # repositories were private. They are not, and that key was a long-lived
  # private key created to work around a problem that did not exist.
  # `tests/ci.rs::the_drift_job_clones_anonymously_and_needs_no_credential`
  # fails this file — on a pantry-only clone, in a minute — if a secret
  # reference, an SSH-form remote, an install of a key or a credential-bearing
  # URL reappears anywhere in it, so the next person who reaches for one finds
  # out in CI rather than in a merge review. That test is why this comment does
  # not name the old secret: naming it would trip the check that exists to keep
  # it gone.
  #
  # WHAT A GREEN RUN OF THIS JOB PROVES. That, as of this run, every registered
  # entry is a verbatim byte copy of the service's own `cafaye.yml`, that every
  # field pantry publishes about a service is a field the service publishes,
  # that each curated `kind` and `basePath` agrees with the service's own
  # manifest and OpenAPI document, that the vendored schema is core's, and that
  # every exclusion row's stated reason is still true. That is the fleet-facing
  # check, and it is the only one in this repository that reads the fleet.
  #
  # WHAT IT STILL DOES NOT PROVE, said out loud rather than left to a green
  # badge:
  #
  #   1. It reads each sibling's DEFAULT BRANCH as of this run. A change in
  #      `identity` that has not reached `identity`'s master is invisible here,
  #      so a red in this job is a finding about what has already landed, and
  #      the absence of a red is not evidence about a pending pull request.
  #   2. It proves the registry is TRUE, not that it is COMPLETE. Completeness is
  #      the curation tests' claim, and they are bounded by CAFAYE_REPOS below:
  #      a cafaye repository nobody has added to that list is not cloned, not
  #      registered and not noticed. The list is the honest limit of this job
  #      and the next one is a DECISION NEEDED, not something to paper over.
  #   3. A red in this job is almost always a finding about ANOTHER repository.
  #      `registry/` here is a copy of somebody else's file, and this repository
  #      does not own it — so the fix is to report the finding and open the
  #      change where the file lives, never to edit the copy to make the badge
  #      green. A copy quietly edited to match the thing it is supposed to
  #      check is a registry that cannot be audited.
  #   4. One curated repository is not in this workspace at all: `cafaye-rb`,
  #      which is private. Its exclusion row's reason is therefore checked by a
  #      developer's run of tests/schema.rs and not by this job. The row is
  #      still there, still machine-checked, and still fails when its manifest
  #      stops looking like a library — but only where the checkout exists. See
  #      CAFAYE_UNREADABLE below for the fact and tests/ci.rs for the check.
  #
  # WHAT A PANTRY-ONLY CLONE WOULD HAVE PROVEN, which is the failure mode this
  # job was disabled for and the one to reintroduce by accident: nothing about
  # the fleet at all. Without a workspace, `cafaye_root()` misses, every drift
  # test prints `SKIP …` and returns green, and the run looks identical to a
  # pass. The guard below exists because of exactly that — it is the difference
  # between a workspace that is present and one that only looks present.
  workspace-drift:
    name: registry drift (the fleet, cloned anonymously)
    runs-on: ubuntu-latest
    # The repositories to fetch, as one value rather than a shell array so that
    # tests/ci.rs and this job read the same list instead of two spellings of
    # it that can drift apart.
    #
    # THIS LIST IS DELIBERATE AND IT IS THE ONE THING TO UPDATE BY HAND. It is
    # the whole cafaye organisation, not the subset the registry happens to
    # name: the optimisation of cloning only what the registry registers is a
    # trap, because it makes coverage a function of the registry, so the moment
    # a ninth service is registered this job is silently wrong in the direction
    # that matters — the repository nobody remembered is the one nobody checks.
    #
    # What breaks when you forget to add a repository here: no drift test ever
    # compares the registry against it, no coverage test ever asks whether it
    # should be registered, and nothing goes red — for a repository that has
    # never been written down anywhere, that is the whole failure. The reverse
    # direction is enforced: `tests/ci.rs` fails the `build` job when
    # registry/index.yml curates a repository this list does not name, so adding
    # a service to the registry and forgetting this list is a red within a
    # minute. `docs` is here because the coverage test in tests/drift.rs asks
    # about it by name. `pantry` is absent because it is the checkout above.
    #
    # CAFAYE_UNREADABLE is the repositories this job cannot clone, and why. It
    # is a fact about the runner, not an exemption from coverage:
    #
    #   cafaye-rb is PRIVATE — `gh repo view cafaye/cafaye-rb` says PRIVATE, and
    #   an anonymous `git clone https://github.com/cafaye/cafaye-rb.git` from a
    #   hosted runner is a 404. That is why it is named here rather than left to
    #   fail the clone step: a 404 reads as "this repository does not exist", not
    #   as "this repository is not yours", and the second reading is the true
    #   one. The credential that would fix it is exactly what pantry-04 deleted
    #   from this workflow — a long-lived key in repository settings, for one
    #   private repository that is a Ruby gem and not a service.
    #
    # What it costs, stated here rather than left to be inferred from a green
    # badge: `every_exclusion_reason_is_still_true` cannot check the
    # `cafaye-rb` exclusion row, because there is no checkout to read. That row's
    # reason is verified by a developer's run of the test with
    # PANTRY_CAFAYE_ROOT pointed at a real workspace, and by nothing else.
    # `tests/schema.rs` prints a SKIP for that row saying exactly that, and
    # `tests/ci.rs` keeps this list and registry/index.yml honest in both
    # directions — so a repository that becomes readable is a red rather than a
    # silent loss of coverage.
    #
    # A repository belongs in this list only while it is genuinely unreadable
    # from here. Moving one back into CAFAYE_REPOS once it is public is the fix,
    # and `an_unreadable_repository_is_neither_cloned_nor_registered` below is
    # what makes that move a decision rather than a forgetting.
    env:
      CAFAYE_REPOS: core caf identity billing courier darkroom muse guard parlor kit docs
      CAFAYE_UNREADABLE: cafaye-rb
    steps:
      - uses: actions/checkout@v4
        with:
          path: pantry
          fetch-depth: 0

      - name: check out the fleet
        run: |
          set -euo pipefail
          # `read -a` rather than `for repo in $CAFAYE_REPOS`, because unquoted
          # expansion splits on whitespace in bash and does not in zsh or fish:
          # a guard that silently iterates one 90-character "repository name"
          # is worse than no guard, and this file is read by more shells than
          # the runner's.
          read -r -a repos <<< "$CAFAYE_REPOS"
          for repo in "${repos[@]}"; do
            git clone --depth 1 "https://github.com/cafaye/${repo}.git" "$repo"
          done

      # A clone that quietly did not happen is the failure this job cannot
      # report, because its symptom is a workspace that is present and
      # unreadable: `cafaye_root()` looks for exactly one file to decide a
      # workspace exists, and every drift test SKIPs — green — when it is
      # absent. So every checkout is checked for the two things the drift tests
      # actually read: git metadata, and core's schema as the workspace marker.
      # A guard that only covered core would let the other ten fail silently,
      # and one that demanded a `cafaye.yml` would be wrong — `kit` is
      # configuration and carries none, which is why it is in the exclusion
      # record in the first place.
      - name: prove the workspace is real
        run: |
          set -euo pipefail
          read -r -a repos <<< "$CAFAYE_REPOS"
          for repo in "${repos[@]}"; do
            if [ ! -d "$repo/.git" ]; then
              echo "::error::$repo cloned to a directory with no git metadata — the drift tests would skip it"
              exit 1
            fi
          done
          test -f core/schemas/cafaye.manifest.schema.json || {
            echo "::error::core/schemas/cafaye.manifest.schema.json is missing, so cafaye_root() will not find this workspace and every drift test will SKIP"
            exit 1
          }

      # `bin/prime` ends by running the platform CLI's own `contract lint` over
      # this manifest and every registry entry, guarded on `../caf` being a
      # checkout — and `caf` is on the list above, so that step RUNS here rather
      # than skipping, which means the whole registry is validated by the
      # platform's own CLI on every run. It needs a Go toolchain, and the runner
      # image's is not a version this file can promise anything about: caf's
      # go.mod says 1.25, and a runner shipping less would fail on a build
      # rather than on a registry. `actions/setup-go@v7` with `stable` is the
      # same action and the same default kit's reusable workflow uses,
      # deliberately, so the two cannot drift apart. It runs after the clone
      # because its cache key is `caf/go.sum`.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: caf/go.sum

      # The whole gate, with the workspace reachable, so the drift tests run
      # instead of skipping. The exit code is the last command's and nothing is
      # piped, per PLAN.md §1.
      - name: prime
        working-directory: pantry
        env:
          PANTRY_CAFAYE_ROOT: ${{ github.workspace }}
        run: ./bin/prime
